<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
    <script type="module" src="./scripts.js"></script>
</head>

<body>
    <div id="main-container">

        <aside>
            <nav>
                <h2>Projects</h2>
                <ul id="button-container">
                </ul>
                <button id="new-project-btn">New Project</button>
                <dialog id="project-dialog" show>
                    <form id="project-form" method="dialog" class="project-form">
                        <h2>New Project</h2>
                        <div class="form-input-flex">
                            <div>
                                <label for="title">Title</label>
                                <input type="text" id="title" name="title">
                            </div>
    
                            <div>
                                <label for="due">Due Date</label>
                                <input type="date" id="due" name="due">
                            </div>
                        </div>
    
                        <div class="form-button-container">
                            <button id="project-reset-button" class="form-button" type="submit">Close</button>
                            <button id="project-submit-button" class="form-button" type="submit">Submit</button>
                        </div>
                    </form>
                </dialog>

            </nav>
        </aside>


        <main>
            <h1 class="project-header">Project Name</h1> 
            <div id="task-container">
            </div>
            <div id="task-container">
                <button id="new-task-btn">New Task</button>
            </div>
            <dialog id="task-dialog">
                <form id="task-form" method="dialog" class="project-form">
                    <h2>New Task</h2>
                    <div class="form-input-flex">
                        <div>
                            <label for="title">Title</label>
                            <input type="text" id="title" name="title">
                        </div>

                        <div>
                            <label for="target">Target</label>
                            <input type="date" id="target" name="target">
                        </div>

                        <div>
                            <label for="priority">Priority</label>
                            <input type="text" id="priority" name="priority">
                        </div>

                        <div>
                            <label for="description">description</label>
                            <input type="text" id="description" name="description">
                        </div>
                    </div>
    
                    <div class="form-button-container">
                        <button id="task-reset-button" class="form-button" type="submit">Close</button>
                        <button id="task-submit-button" class="form-button" type="submit">Submit</button>
                    </div>
                </form>
            </dialog>

        </main>
    </div>
</body>
</html>
